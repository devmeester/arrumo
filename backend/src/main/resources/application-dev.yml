# Local development: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Needs a local PostgreSQL (see README). Loads the demo data.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arrumo}
    password: ${DB_PASSWORD:arrumo}
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    out-of-order: true   # the demo is V1000; new migrations (V3, V4...) still run

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  # key for DEVELOPMENT ONLY; in production generate one with: openssl rand -base64 32
  encryption-key: ${APP_ENCRYPTION_KEY:ZGVzZW52b2x2aW1lbnRvLW5hby11c2FyLWVtLXByb2Q=}
  admin-username: ${APP_ADMIN_USERNAME:admin}
  admin-password: ${APP_ADMIN_PASSWORD:change-me-now-2026}
  secure-cookie: false
